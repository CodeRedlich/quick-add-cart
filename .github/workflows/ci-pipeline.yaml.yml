name: Shopware Plugin CI
run-name: Run CI Pipeline on ${{ github.event_name }}
on:
  pull_request:
    branches:
      - main
      - master

  merge_group:
    types:
      - checks_requested
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHOPWARE_CLI_IMAGE: shopware/shopware-cli:latest-php-8.4

jobs:
  check-composer-version:
    name: Composer version bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare composer.json versions
        env:
          BASE_COMMIT: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def read_version(commit, source):
              manifest = subprocess.run(
                  ["git", "show", f"{commit}:composer.json"],
                  capture_output=True, text=True, encoding="utf-8",
              )
              if manifest.returncode:
                  raise SystemExit(f"::error::{source}: cannot read composer.json at {commit}.")
              try:
                  version = json.loads(manifest.stdout)["version"]
              except (ValueError, KeyError, TypeError):
                  raise SystemExit(f"::error::{source}: composer.json must contain a version.")

              pattern = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              match = re.fullmatch(pattern, version) if isinstance(version, str) else None
              if not match:
                  raise SystemExit(f"::error::{source}: composer.json version must be in MAJOR.MINOR.PATCH format.")
              return version, tuple(map(int, match.groups()))

          base_version, base_parts = read_version(os.environ["BASE_COMMIT"], "Target branch")
          merge_version, merge_parts = read_version("HEAD", "Merge result")
          if merge_parts <= base_parts:
              raise SystemExit(
                  f"::error::Increase composer.json version above {base_version} (found {merge_version})."
              )
          print(f"Composer version increased from {base_version} to {merge_version}.")
          PY

  run-unit-test:
    name: Run PHP unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/composer-downloads
          key: ${{ runner.os }}-composer-unit-${{ env.SHOPWARE_CLI_IMAGE }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-unit-${{ env.SHOPWARE_CLI_IMAGE }}-

      - name: Run unit tests in Docker
        run: |
          mkdir -p "$RUNNER_TEMP/composer-downloads"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/checkout:ro" \
            --volume "$RUNNER_TEMP/composer-downloads:/tmp/composer-cache/files" \
            --env COMPOSER_CACHE_DIR=/tmp/composer-cache \
            --env COMPOSER_ALLOW_SUPERUSER=1 \
            --entrypoint /bin/sh \
            "$SHOPWARE_CLI_IMAGE" -ec '
              mkdir /tmp/quick-add-cart
              cd /tmp/quick-add-cart
              cp -R /checkout/composer.* /checkout/phpunit.xml /checkout/src /checkout/tests .

              composer install --no-interaction --prefer-dist --no-progress
              composer check-platform-reqs
              php vendor/bin/phpunit --configuration phpunit.xml
            '

  run-extension-verifier:
    name: Validate extension (${{ matrix.check-against }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check-against: [lowest, highest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/composer-downloads
          key: ${{ runner.os }}-composer-${{ matrix.check-against }}-${{ env.SHOPWARE_CLI_IMAGE }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.check-against }}-${{ env.SHOPWARE_CLI_IMAGE }}-

      - name: Run Shopware CLI extension validation
        env:
          CHECK_AGAINST: ${{ matrix.check-against }}
        run: |
          mkdir -p "$RUNNER_TEMP/composer-downloads"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/extension" \
            --volume "$RUNNER_TEMP/composer-downloads:/tmp/composer-cache/files" \
            --env COMPOSER_CACHE_DIR=/tmp/composer-cache \
            --workdir /extension \
            "$SHOPWARE_CLI_IMAGE" \
            extension validate . --check-against "$CHECK_AGAINST" --reporter github
